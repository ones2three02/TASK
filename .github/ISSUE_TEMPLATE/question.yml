name: "❓ Question / 问题咨询"
description: Usage questions, configuration issues, or feedback you're not sure is a bug. / 使用疑问、配置问题或不确定是否为 bug 的反馈。
title: "[❓ Question] "
labels: ["question"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 描述
      description: 你想完成什么？已经尝试了什么？
      placeholder: "例如：我想导入需求文档并生成 TASK 四层规划，但 AI 拆解结果不符合预期..."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 环境信息
      description: TASK 版本、操作系统、AI 引擎和相关上下文等。
      placeholder: |
        TASK 版本：
        操作系统：
        数据库：
